[project]
name = "recsys-two-tower"
version = "0.1.0"
description = "Two-Tower + CatBoost RecSys for MovieLens"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "catboost>=1.2",
    "faiss-cpu>=1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "implicit>=0.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.10,<0.17"
]

[project.scripts]
recsys-evaluate = "evaluate:main"
