two_tower:
  embedding_dim: 64
  hidden_dim: 128
  output_dim: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  epochs: 20
  batch_size: 1024
  temperature: 0.07
  seed: 42

ranker:
  iterations: 500
  learning_rate: 0.015
  depth: 5
  l2_leaf_reg: 5.0
  subsample: 0.8
  bootstrap_type: MVS
  seed: 42
  positive_threshold: 4
pipeline:
  retrieval_top_k: 200
  final_top_k: 10
  min_user_ratings: 5
