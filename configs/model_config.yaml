two_tower:
  embedding_dim: 64
  hidden_dim: 128
  output_dim: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  epochs: 20
  batch_size: 1024
  temperature: 0.07
  seed: 42
  recent_k: 10
  popularity_negatives: 8

ranker:
  iterations: 500
  learning_rate: 0.015
  depth: 5
  l2_leaf_reg: 5.0
  subsample: 0.8
  bootstrap_type: MVS
  seed: 42
  positive_threshold: 4
pipeline:
  retrieval_top_k: 200
  final_top_k: 10
  min_user_ratings: 5

# RP3beta is a second candidate source. Off keeps the published FAISS list.
# Co-visitation has no switch: the offline bench measured it and it stays out.
retrieval:
  rp3:
    enabled: false
    alpha: 1.0
    beta: 0.7
    top_k: 200
